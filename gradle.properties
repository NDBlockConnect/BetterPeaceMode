# BetterPeaceMode build properties
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Fabric properties (verify against https://fabricmc.net/develop)
# 1.21.11 is an obfuscated release (the 26.x line is not), so the remap Loom
# plugin variant plus an obfuscation mapping set are required.
minecraft_version=1.21.11
loader_version=0.19.3
loom_version=1.18.2
fabric_api_version=0.141.6+1.21.11

# Mod properties
mod_id=betterpeacemode
mod_name=BetterPeaceMode
mod_version=v26.0-Alpha.3
mod_semver=26.0.0-Alpha.3
maven_group=dev.blockconnect
mod_license=Apache-2.0
